  <script>
  (() => {
    const root = document.getElementById('optics-xp-sketch');

    const ctx = canvas.getContext('2d');

    const stage = root.querySelector('.xp-stage');
    const tooltip = root.querySelector('.xp-hover');
    const state = { view: 'overview', screen: 250, light: true, filter: 'none', labels: true, values: true, aperture: 18, zoom: 1, panX: 0, panY: 0 };
    const design = { blue: '#466faf', table: '#b9ccd0', facets: 12 };
    const views = {
      overview: { az: -116, el: 24, bounds: [[-10,-155,-8],[1270,155,325]], caption: 'Оптическая скамья' },
      top: { az: -90, el: 90, bounds: [[-10,-165,-8],[1270,165,325]], caption: 'Вид сверху · координаты в мм' },
      optics: { az: -133, el: 21, bounds: [[765,-138,0],[1270,112,280]], caption: 'Линза и щель' },
      grating: { az: -180, el: 0, bounds: [[843,-57,132],[867,57,256]], caption: 'Рабочее отверстие решётки' },
      screen: { az: -180, el: 3, bounds: [[244,-153,65],[262,153,326]], caption: 'Экран · шкала с центральным нулём' }
    };
    let W = 900, H = 470, faces = [], scale = 1, ox = 0, oy = 0, right, up, eye;
    let hitScreen = null, drag = null, screenRuler = null, positionGuides = [];
    const pointers = new Map();let pinch = null;
    const rasterCanvas = document.createElement('canvas');
    const rasterContext = rasterCanvas.getContext('2d');
    let rasterImage, rasterDepth, rasterWords, rasterRatio = 2, labelBoxes = [];
    let rasterBudget=1200000, renderPending=0;
    const storageKey='spektr.optics.v1';
    let staticFaceCount=0, staticCache=null;
    const texturePixels = new WeakMap();
    let railTexture = null, screenTexture = null, screenTextureKey = '';
    let lightStrip = null, lightStripKey = '';
    const rad = x => x * Math.PI / 180;
    const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
    const sub = (a,b) => a.map((v,i)=>v-b[i]);
    const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
    const norm = a => { const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
    const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
    function rgb(hex, factor=1) { const n=parseInt(hex.slice(1),16); return `rgb(${[n>>16,(n>>8)&255,n&255].map(x=>Math.round(clamp(x*factor,0,255))).join(',')})`; }
    function project(p) { return [ox+dot(p,right)*scale,oy-dot(p,up)*scale]; }
    function poly(p,color,shade=false,alpha=1) {
      let fill=color;
      if(shade){ const n=norm(cross(sub(p[1],p[0]),sub(p[2],p[0]))); fill=rgb(color,.77+.23*Math.abs(dot(n,[-.4,-.35,.845]))); }
      faces.push({p,fill,alpha,depth:p.reduce((s,v)=>s+dot(v,eye),0)/p.length});
    }
    function line(p,color='#626a69',width=1) { faces.push({p,stroke:color,width,alpha:1,depth:p.reduce((s,v)=>s+dot(v,eye),0)/p.length+.08}); }
    function decal(p,texture,uv=[[0,0],[1,0],[1,1],[0,1]]) { faces.push({p,texture,uv,alpha:1,depth:p.reduce((s,v)=>s+dot(v,eye),0)/p.length}); }
    function box(x0,x1,y0,y1,z0,z1,color,triangles=false){
      const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
      const f=[[0,3,2,1],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]];
      f.forEach(ids=>poly(ids.map(j=>v[j]),color,true));
    }
    function cylinderZ(x,y,z0,z1,r,color,n=8){
      const a=[],b=[];for(let i=0;i<n;i++){const t=i*2*Math.PI/n;a.push([x+r*Math.cos(t),y+r*Math.sin(t),z0]);b.push([x+r*Math.cos(t),y+r*Math.sin(t),z1]);}
      for(let i=0;i<n;i++)poly([a[i],a[(i+1)%n],b[(i+1)%n],b[i]],color,true);

    }
    function ring(x,y,z,r,inner,width,color,n=design.facets,glass=null){
      const front=[],back=[],hole=[],backHole=[];
      for(let i=0;i<n;i++){const a=i*2*Math.PI/n;front.push([x-width/2,y+Math.cos(a)*r,z+Math.sin(a)*r]);back.push([x+width/2,y+Math.cos(a)*r,z+Math.sin(a)*r]);hole.push([x-width/2-.1,y+Math.cos(a)*inner,z+Math.sin(a)*inner]);backHole.push([x+width/2,y+Math.cos(a)*inner,z+Math.sin(a)*inner]);}
      for(let i=0;i<n;i++){const j=(i+1)%n;poly([front[i],front[j],back[j],back[i]],color,true);poly([front[i],hole[i],hole[j],front[j]],color,true);poly([back[j],backHole[j],backHole[i],back[i]],color,true);poly([hole[j],hole[i],backHole[i],backHole[j]],'#a4afa7',true);}
      if(glass){poly(hole,glass,false,.87);for(let i=0;i<n;i+=3)poly([[x-width/2-.3,y,z],hole[i],hole[(i+2)%n]],'#e5f0e6',false,.17);}

    }
    function screw(x,y,z){cylinderZ(x,y,z,z+4,4,'#8f9692',6);line([[x-2,y,z+4.4],[x+2,y,z+4.4]],'#535f60',1);}
    function base(x0,x1,individual=false){const edge=individual?37:33;box(x0,x1,-edge,33,45,82,'#c9c7b9');screw(x0+10,-20,82);screw(x1-10,20,82);box(x0+3,x1-3,-edge-4,-edge,49,76,individual?'#8d9a93':'#989d96');}
    function holder(x,type){
      cylinderZ(x,0,82,144,14,'#c5c5b8',8);cylinderZ(x,0,140,153,8,'#989f9b',8);box(x-15,x+15,-34,34,143,153,'#bfc2b6');
      const glass=type==='lens'?'#adc7c8':type==='grating'?'#b3c3bc':type==='red'?'#a75243':type==='green'?'#658c67':type==='blue'?'#526faa':null;
      let face=ring(x,0,195,48,type==='grating'?35:31,17,'#ddd9c9',design.facets,type==='grating'?null:glass);
      if(type==='grating'){
        // A fixed carrier around a variable clear aperture; its mechanism is not known from the photo.
        face=ring(face+.4,0,195,35,12,.8,'#b8bab0',design.facets);
        for(const y of[-25,25])ring(face-1,y,190,4.5,0,4.5,'#deded2',8);
        face=ring(face+.2,0,195,12,state.aperture/2,.5,'#67736c',24,'#b8c9c6');
      }
      if(type==='slit'){
        const disc=Array.from({length:design.facets},(_,i)=>{const a=i*2*Math.PI/design.facets;return[face,30.7*Math.cos(a),195+30.7*Math.sin(a)];});
        poly(disc,'#485454');poly([[face-.2,-1,178],[face-.2,1,178],[face-.2,1,212],[face-.2,-1,212]],'#fff2c1');
      }
      if(type==='grating'){const r=state.aperture/2;for(let y=-r+1;y<r;y+=1.5){const h=Math.sqrt(r*r-y*y);line([[face-.2,y,195-h],[face-.2,y,195+h]],'#799599',.45);}}
      if(type==='lens')line([[face-.3,-18,215],[face-.3,2,222],[face-.3,15,215]],'#f0f4e9',1.4);
    }
    function spectrumStrip(){
      const key=[state.light,state.filter,state.screen,state.aperture].join(':');
      if(lightStrip&&lightStripKey===key)return lightStrip;
      const profile=SpektrSpectrum.profile({distanceMm:855-state.screen,apertureMm:state.aperture,filter:state.filter,light:state.light});

    function screenFace(x){

      for(let y=-110;y<=110;y+=5){const major=y%10===0;c.beginPath();c.moveTo(135+y,124);c.lineTo(135+y,major?116:120);c.stroke();if(major&&(y===0||y%(every*10)===0))c.fillText(String(Math.abs(y)/10),135+y,108);}

    function railScale(){
      if(!railTexture){

      const x=state.screen-5.2,y=screenRuler.y,value=Math.abs(y),within=value<=110;
      const a=project([x,y,302]),b=project([x,y,202]),c=project([x,y,173]),d=project([x,y,113]);
      ctx.save();ctx.strokeStyle='#3b6079b8';ctx.lineWidth=.85;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.moveTo(...c);ctx.lineTo(...d);ctx.stroke();ctx.setLineDash([]);
      const rulerZ=screenRuler.z>173&&screenRuler.z<206?214:clamp(screenRuler.z,124,289);
      const zero=project([x,0,rulerZ]),tip=project([x,y,rulerZ]);
      ctx.strokeStyle='#446a7dc9';ctx.beginPath();ctx.moveTo(...zero);ctx.lineTo(...tip);
      for(let mm=0;mm<=value;mm+=10){const yy=Math.sign(y)*mm,t=project([x,yy,rulerZ]);ctx.moveTo(t[0],t[1]-2.5);ctx.lineTo(t[0],t[1]+2.5);}
      ctx.moveTo(tip[0],tip[1]-4);ctx.lineTo(tip[0],tip[1]+4);ctx.stroke();
      if(within){
        const text=`${Math.round(value)} мм`,p=project([x,y,113]);ctx.font='11px Tahoma, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const tw=ctx.measureText(text).width+12;
        const tx=clamp(p[0],tw/2+7,W-tw/2-7),ty=Math.min(H-14,p[1]+17);ctx.fillStyle='#ece9d8e8';ctx.fillRect(tx-tw/2,ty-9,tw,18);ctx.fillStyle='#345264';ctx.fillText(text,tx,ty);canvas.dataset.rulerMm=String(Math.round(value));
      }else delete canvas.dataset.rulerMm;

    }
    function repaintRuler(){ctx.drawImage(rasterCanvas,0,0,W,H);drawScreenRuler();}
    function capture(e){try{canvas.setPointerCapture(e.pointerId);}catch(_){}}
    function cancelGesture(){

    }

      const p=point(e);

        pointers.set(e.pointerId,p);capture(e);
        if(pointers.size>=2){if(pointers.size===2){const now=pinchPoints();pinch={...now,zoom:state.zoom};drag=null;clearPointer();}return;}
      }
      if(drag||e.button!==0&&e.button!==1)return;
      const plane=state.view==='screen'?onScreenPlane(p):null;
      if(plane&&!e.shiftKey&&e.button===0){screenRuler=state.values?plane:null;canvas.style.cursor=screenRuler?'crosshair':'default';repaintRuler();return;}
      if(screenHit(p)&&!e.shiftKey&&e.button===0){
        const a=project([0,0,0]),b=project([1,0,0]);drag={kind:'screen',pointer:e.pointerId,p,start:state.screen,dx:b[0]-a[0],dy:b[1]-a[1]};
      }else if(state.zoom!==1||e.shiftKey||e.button===1){
        drag={kind:'pan',pointer:e.pointerId,p,panX:state.panX,panY:state.panY};
      }

    });
    canvas.addEventListener('pointermove',e=>{
      const p=point(e);
      if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);

        state.panX=clamp(state.panX+(now.mid[0]-pinch.mid[0])/W,-1.5,1.5);
        state.panY=clamp(state.panY+(now.mid[1]-pinch.mid[1])/H,-1.5,1.5);
        pinch.mid=now.mid;camera();queueRender();return;
      }
      if(drag&&e.pointerId!==drag.pointer)return;
      if(drag){
        if(drag.kind==='screen'){
          const denom=drag.dx**2+drag.dy**2;
          state.screen=clamp(Math.round(drag.start+((p[0]-drag.p[0])*drag.dx+(p[1]-drag.p[1])*drag.dy)/denom),100,650);
        }else{
          state.panX=clamp(drag.panX+(p[0]-drag.p[0])/W,-1.5,1.5);state.panY=clamp(drag.panY+(p[1]-drag.p[1])/H,-1.5,1.5);
        }
        tooltip.style.display='none';queueRender();return;
      }
      if(state.view==='screen'){
        tooltip.style.display='none';screenRuler=state.values?onScreenPlane(p):null;canvas.style.cursor=screenRuler?'crosshair':state.zoom!==1?'grab':'default';repaintRuler();return;
      }
      const hit=screenHit(p);canvas.style.cursor=hit||state.zoom!==1?'grab':'default';tooltip.style.display=hit&&state.values?'block':'none';
      if(hit&&state.values){tooltip.textContent='Экран · '+state.screen+' мм';tooltip.style.left=Math.min(p[0]+14,W-135)+'px';tooltip.style.top=Math.min(p[1]+18,H-33)+'px';}
    });
    function endPointer(e){

      if(!drag||e.pointerId!==drag.pointer)return;

    }
    canvas.addEventListener('pointerup',endPointer);
    canvas.addEventListener('pointercancel',e=>{endPointer(e);clearPointer();queueRender();});
    canvas.addEventListener('lostpointercapture',e=>{if(drag&&drag.pointer===e.pointerId)endPointer(e);});
    canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='touch'&&state.view==='screen')return;if(!drag&&!pinch){clearPointer();if(state.view==='screen')repaintRuler();}});
    if(window.openai)restore(window.openai.widgetState);
    else{try{restore(JSON.parse(localStorage.getItem(storageKey)));}catch(_){}}
    window.addEventListener('openai:set_globals',e=>{const saved=e.detail&&e.detail.globals&&e.detail.globals.widgetState;if(saved){restore(saved);render();}});
    setupSpektrWindows(root,queueRender);
    render();
    if(typeof ResizeObserver==='function')new ResizeObserver(queueRender).observe(stage);
    else window.addEventListener('resize',queueRender);
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(design,'blue',{label:'Синий заголовок',reference:'--xp-blue'});tweak.addColorPicker(design,'table',{label:'Цвет стола',reference:'--xp-table'});tweak.addSlider(design,'facets',{label:'Количество граней оправ',min:8,max:16,step:4});}
  })();
